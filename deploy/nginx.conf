# /etc/nginx/sites-available/chef-lan-web  (then: ln -s into sites-enabled, nginx -t, reload)
#
# A SECOND server block next to wish-list's. nginx picks the block by hostname, so both sites
# share ports 80 and 443; only the app behind each one listens on its own local port.
# Replace <chef-lan-domain> with the real hostname once DNS points at this VPS.
#
# Add HTTPS the same way as for wish-list:
#   sudo certbot --nginx -d <chef-lan-domain>
# certbot rewrites this block to listen on 443 and adds the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name <chef-lan-domain>;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
