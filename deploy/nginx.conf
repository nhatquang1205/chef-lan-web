# /etc/nginx/sites-available/chef-lan-web  (then: ln -s into sites-enabled, nginx -t, reload)
#
# The customer website, courses.bonbocon.com. A separate server block next to the API's, the admin's and
# wish-list's: nginx picks the block by hostname, so all share ports 80 and 443; only the app behind each
# one listens on its own local port.
# The API is NOT served from this host: browsers call https://api.bonbocon.com (see chef-lan/deploy/nginx/).
#
# Add HTTPS the same way as for wish-list:
#   sudo certbot --nginx -d courses.bonbocon.com
# certbot rewrites this block to listen on 443 and adds the redirect.

server {
    # Answer only requests that come through Cloudflare (chef-lan deploy/nginx/snippets/cloudflare-only.conf).
    include snippets/cloudflare-only.conf;
    listen 80;
    listen [::]:80;
    server_name courses.bonbocon.com;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
